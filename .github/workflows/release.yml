name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag name to attach release to (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android 34 platform and Build-Tools 36.0.0
        shell: bash
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;36.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests and assemble Debug APK
        run: gradle :core:test :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Package release APK
        shell: bash
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "FlashSkip-${VERSION}-debug.apk"
          sha256sum "FlashSkip-${VERSION}-debug.apk" > "FlashSkip-${VERSION}-debug.apk.sha256"
          echo "RELEASE_TAG=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FlashSkip ${{ env.RELEASE_VERSION }}
          make_latest: true
          generate_release_notes: true
          files: |
            FlashSkip-*-debug.apk
            FlashSkip-*-debug.apk.sha256
